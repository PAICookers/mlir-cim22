[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "mlir-cim22"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "pyserial>=3.5,<4", "torch>=2.14,<3", "torch-mlir"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "spikingjelly>=0.0.0.0.12,<1", "uvicorn>=0.34,<1"]
tensorflow = ["tensorflow==2.20.0", "tf2onnx==1.17.0", "onnx>=1.21.0,<2"]

[project.scripts]
cim22-web = "cim22.web.__main__:main"

[dependency-groups]
dev = [
    "onnx>=1.21.0,<2",
    "protobuf>=6.31.1",
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
]

[project.entry-points."torch_dynamo_backends"]
cim22 = "cim22.backend:backend"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build"
cmake.source-dir = ".."
wheel.packages = ["cim22"]
wheel.install-dir = "cim22"
wheel.py-api = "py3"
install.components = ["runtime", "dev"]

[tool.scikit-build.wheel.force-include]
"../LICENSE" = "${SKBUILD_METADATA_DIR}/licenses/LICENSE"
"cim22/web/static" = "cim22/web/static"

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torch-mlir = [
    { url = "https://github.com/llvm/torch-mlir/releases/download/v20261101/torch_mlir-20261101-cp312-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux'" },
    { url = "https://github.com/llvm/torch-mlir/releases/download/v20261101/torch_mlir-20261101-cp312-abi3-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
markers = [
    "integration: requires native runtime; compilation also needs the compile tool and torch-mlir",
]

[tool.ruff]
target-version = "py312"
line-length = 80
extend-exclude = ["**/_generated/**"]

[tool.ruff.lint]
select = ["F", "E9", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cim22"]

[tool.ruff.lint.per-file-ignores]
"**/lit.cfg.py" = ["F821"]
