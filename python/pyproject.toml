[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mlir-cim22-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "torch==2.14.0", "protobuf==6.31.1"]

[project.optional-dependencies]
compiler = ["torch-mlir==20260930.892"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.17,<0.18"]

[project.entry-points."torch_dynamo_backends"]
cim22 = "cim22.backend:backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["cim22*"]

[tool.uv]
required-version = ">=0.13"
# The compiler wheel and native model ABI currently target Linux x86-64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torch-mlir = { url = "https://github.com/llvm/torch-mlir-release/releases/download/dev-wheels/torch_mlir-20260930.892-cp312-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" }

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
markers = [
    "integration: requires native runtime; compilation also needs compiler/torch-mlir",
]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py312"
extend-exclude = ["cim22/_generated"]
