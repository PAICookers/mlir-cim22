[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "mlir-cim22"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26,<3", "torch>=2.14,<3", "torch-mlir"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "spikingjelly>=0.0.0.0.12,<1", "uvicorn>=0.34,<1"]
tensorflow = ["tensorflow==2.20.0", "tf2onnx==1.17.0", "onnx>=1.21.0,<2"]

[project.scripts]
cim22-web = "cim22.web.__main__:main"

[dependency-groups]
dev = [
    "onnx>=1.21.0,<2",
    "protobuf>=6.31.1",
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
]

[project.entry-points."torch_dynamo_backends"]
cim22 = "cim22.backend:backend"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build"
cmake.source-dir = ".."
wheel.packages = ["cim22"]
wheel.install-dir = "cim22"
wheel.py-api = "py3"
wheel.force-include = { "LICENSE" = "${SKBUILD_METADATA_DIR}/licenses/LICENSE" }
install.components = ["runtime", "dev"]
# Frontend output is ignored by Git but must also survive sdist -> wheel.
sdist.include = ["cim22/web/static"]

[tool.scikit-build.sdist.force-include]
"../CMakeLists.txt" = "native/CMakeLists.txt"
"../LICENSE" = "LICENSE"
"../BUILDING.md" = "BUILDING.md"
"../cmake" = "native/cmake"
"../include" = "native/include"
"../lib" = "native/lib"
"../schema" = "native/schema"
"../tools/CMakeLists.txt" = "native/tools/CMakeLists.txt"
"../tools/mlir-cim22-opt" = "native/tools/mlir-cim22-opt"
"../tools/mlir-cim22-onnx-import" = "native/tools/mlir-cim22-onnx-import"
"../test" = "native/test"
"tests/_generated" = "native/python/tests/_generated"

[[tool.scikit-build.overrides]]
if.from-sdist = true
cmake.source-dir = "native"

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torch-mlir = [
    { url = "https://github.com/llvm/torch-mlir/releases/download/v20261001/torch_mlir-20261001-cp312-abi3-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux'" },
    { url = "https://github.com/llvm/torch-mlir-release/releases/download/dev-wheels/torch_mlir-20260923.595-cp312-abi3-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
markers = [
    "integration: requires native runtime; compilation also needs compiler/torch-mlir",
]

[tool.ruff]
target-version = "py312"
line-length = 80
extend-exclude = ["**/_generated/**"]

[tool.ruff.lint]
select = ["F", "E9", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cim22"]

[tool.ruff.lint.per-file-ignores]
"**/lit.cfg.py" = ["F821"]
