name: Build Linux and Windows wheels

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

env:
  LLVM_VERSION: '22.1.8'
  LLVM_COMMIT: ca7933e47d3a3451d81e72ac174dcb5aa28b59d1

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            artifact-path: .cache/manylinux/sdk-package
          - platform: windows
            runner: windows-2022
            artifact-path: .cache/windows/llvm-sdk
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache Linux SDK
        if: matrix.platform == 'linux'
        id: sdk-cache-linux
        uses: actions/cache@v6
        with:
          path: .cache/manylinux/sdk-package
          key: llvm-sdk-x86_64-${{ env.LLVM_COMMIT }}-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}

      - name: Cache Windows SDK
        if: matrix.platform == 'windows'
        id: sdk-cache-windows
        uses: actions/cache@v6
        with:
          path: .cache/windows/llvm-sdk
          key: llvm-sdk-windows-2022-x64-${{ env.LLVM_COMMIT }}-${{ hashFiles('.github/scripts/build-llvm-sdk.ps1') }}

      - name: Checkout pinned LLVM source for Linux
        if: matrix.platform == 'linux' && steps.sdk-cache-linux.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_COMMIT }}
          path: .cache/manylinux/llvm-source
          persist-credentials: false

      - name: Checkout pinned LLVM source for Windows
        if: matrix.platform == 'windows' && steps.sdk-cache-windows.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_COMMIT }}
          path: .cache/windows/llvm-source
          persist-credentials: false

      - name: Restore Linux ccache
        if: matrix.platform == 'linux' && steps.sdk-cache-linux.outputs.cache-hit != 'true'
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .cache/manylinux/ccache
          key: llvm-ccache-x86_64-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}-${{ env.LLVM_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llvm-ccache-x86_64-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}-${{ env.LLVM_COMMIT }}-
            llvm-ccache-x86_64-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}-

      - name: Prepare Windows build environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build static Linux LLVM/MLIR SDK in manylinux
        if: matrix.platform == 'linux' && steps.sdk-cache-linux.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          mkdir -p .cache/manylinux/{sdk-package,ccache,work}
          df -h .
          docker build -f .github/manylinux/Containerfile -t cim22-manylinux .github/manylinux
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/io:ro" \
            -v "$PWD/.cache/manylinux/llvm-source:/llvm-source:ro" \
            -v "$PWD/.cache/manylinux/ccache:/ccache" \
            -v "$PWD/.cache/manylinux/work:/work" \
            -v "$PWD/.cache/manylinux/sdk-package:/out" \
            -e HOME=/work/home -e LLVM_VERSION -e LLVM_COMMIT \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            cim22-manylinux bash /io/.github/scripts/build-llvm-sdk.sh
          df -h .

      - name: Build static Windows LLVM/MLIR SDK
        if: matrix.platform == 'windows' && steps.sdk-cache-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: .github/scripts/build-llvm-sdk.ps1 -SourceDir .cache/windows/llvm-source -SdkDir .cache/windows/llvm-sdk

      - name: Save Linux ccache
        if: ${{ always() && matrix.platform == 'linux' && steps.sdk-cache-linux.outputs.cache-hit != 'true' && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/manylinux/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Verify Linux SDK archive
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: .cache/manylinux/sdk-package
        run: sha256sum --check SHA256SUMS

      - name: Verify Windows SDK
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (!(Test-Path .cache/windows/llvm-sdk/SDK-INFO.txt)) {
              throw 'Windows SDK is missing SDK-INFO.txt'
          }
          $llvmConfig = (Resolve-Path .cache/windows/llvm-sdk/bin/llvm-config.exe).Path
          if ((& $llvmConfig --version) -ne $env:LLVM_VERSION -or
              (& $llvmConfig --shared-mode) -ne 'static' -or
              (& $llvmConfig --build-mode) -ne 'Release' -or
              (& $llvmConfig --assertion-mode) -ne 'OFF') {
              throw 'Expected the pinned static Windows LLVM/MLIR SDK'
          }

      - uses: actions/upload-artifact@v7
        with:
          name: llvm-sdk-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-wheel:
    needs: sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            sdk-package: .cache/manylinux/sdk-package
            dist-dir: manylinux
          - platform: windows
            runner: windows-2022
            sdk-package: .cache/windows/llvm-sdk
            dist-dir: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: llvm-sdk-${{ matrix.platform }}
          path: ${{ matrix.sdk-package }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare Windows build environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Windows build tools
        if: matrix.platform == 'windows'
        run: python -m pip install uv==0.13.1 ninja==1.13.2 wheel

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set release or development wheel version
        run: |
          python .github/scripts/test_prepare_wheel.py
          python .github/scripts/prepare-wheel.py

      - name: Extract shared Linux SDK
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cd .cache/manylinux/sdk-package
          sha256sum --check SHA256SUMS
          mkdir ../llvm-sdk
          tar --use-compress-program='zstd -d' -xf llvm-sdk.tar.zst -C ../llvm-sdk
          echo "LLVM_SDK_SHA256=$(sha256sum llvm-sdk.tar.zst | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          rm -- llvm-sdk.tar.zst

      - name: Verify Linux CyUSB bundle
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: third_party/cyusb-linux
        run: sha256sum --check SHA256SUMS

      - name: Build Linux wheel in manylinux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PROJECT_COMMIT: ${{ github.sha }}
          BUILD_RUNNER: ubuntu-24.04
        run: |
          set -euo pipefail
          mkdir -p .cache/manylinux/work python/dist/manylinux
          docker build -f .github/manylinux/Containerfile -t cim22-manylinux .github/manylinux
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/io" \
            -v "$PWD/.cache/manylinux/llvm-sdk:/opt/llvm:ro" \
            -v "$PWD/.cache/manylinux/work:/work" \
            -v "$PWD/python/dist/manylinux:/out" \
            -e HOME=/work/home -e PROJECT_COMMIT -e BUILD_RUNNER \
            -e LLVM_VERSION -e LLVM_COMMIT -e LLVM_SDK_SHA256 \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            cim22-manylinux bash /io/.github/scripts/build-manylinux.sh

      - name: Build Windows wheel with USB support
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .github/scripts/build-windows-wheel.ps1 -SdkDir .cache/windows/llvm-sdk -CyapiRoot third_party/cyapi -DistDir python/dist/windows

      - name: Check Linux wheel contents
        if: matrix.platform == 'linux'
        shell: bash
        run: python .github/scripts/check-wheel-contents.py python/dist/manylinux/*.whl

      - name: Check Windows wheel contents
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python .github/scripts/check-wheel-contents.py (Get-ChildItem python/dist/windows/*.whl).FullName

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: python/dist/${{ matrix.dist-dir }}/*
          if-no-files-found: error
          archive: false
          retention-days: 14

  validate-wheel:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            dist-dir: manylinux
          - platform: linux
            runner: ubuntu-24.04
            dist-dir: manylinux
          - platform: linux
            runner: ubuntu-26.04
            dist-dir: manylinux
          - platform: windows
            runner: windows-2022
            dist-dir: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.platform }}
          path: python/dist/${{ matrix.dist-dir }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare Windows validation environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate Linux checksum
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: python/dist/manylinux
        run: sha256sum --check SHA256SUMS-linux

      - name: Validate Windows checksum
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: python/dist/windows
        run: |
          $checksum = (Get-Content -Raw SHA256SUMS-windows).Trim() -split '  ', 2
          $wheel = @(Get-ChildItem '*.whl')
          if ($checksum.Count -ne 2 -or $wheel.Count -ne 1 -or $checksum[1] -ne $wheel[0].Name -or
              (Get-FileHash $wheel[0].FullName -Algorithm SHA256).Hash -ne $checksum[0]) {
              throw 'Windows wheel checksum mismatch'
          }

      - name: Validate installed Linux wheel outside checkout
        if: matrix.platform == 'linux'
        shell: bash
        run: bash .github/scripts/test-wheel.sh python/dist/manylinux

      - name: Validate installed Windows wheel outside checkout
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .github/scripts/test-windows-wheel.ps1 -DistDir python/dist/windows
