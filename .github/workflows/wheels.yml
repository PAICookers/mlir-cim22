name: Build wheels

on:
  push:
    branches: [main]
    tags: ['v*']
    # Branch pushes are limited to inputs that can change the wheel bytes.
    # GitHub ignores paths for tag pushes, so release tags remain enabled.
    paths:
      - '.github/workflows/wheels.yml'
      - '.github/manylinux/**'
      - '.github/scripts/build-llvm-sdk.sh'
      - '.github/scripts/build-llvm-sdk.ps1'
      - '.github/scripts/build-manylinux.sh'
      - '.github/scripts/build-windows-wheel.ps1'
      - '.github/scripts/prepare-wheel.py'
      - '.github/scripts/repack-native-wheel.py'
      - 'CMakeLists.txt'
      - 'LICENSE'
      - 'cmake/**'
      - 'include/**'
      - 'lib/**'
      - 'runtime/**'
      - 'schema/**'
      - 'tools/**'
      - 'python/cim22/**'
      - 'python/pyproject.toml'
      - 'python/uv.lock'
      - 'web/components.json'
      - 'web/index.html'
      - 'web/package.json'
      - 'web/pnpm-lock.yaml'
      - 'web/pnpm-workspace.yaml'
      - 'web/src/**'
      - 'web/tsconfig.json'
      - 'web/vite.config.ts'
      - 'third_party/cyapi/**'
      - 'third_party/cyusb-linux/**'
  workflow_dispatch:

env:
  LLVM_VERSION: '22.1.8'
  LLVM_COMMIT: ca7933e47d3a3451d81e72ac174dcb5aa28b59d1

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-web-static
          path: python/cim22/web/static/
          if-no-files-found: error
          retention-days: 7

  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            sdk-package: .cache/manylinux/sdk-package
            sdk-suffix: Linux-X64.tar.zst
          - platform: windows
            runner: windows-2022
            sdk-package: .cache/windows/sdk-package
            sdk-suffix: x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore native wheel payload
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: native-wheel-payload
          key: >-
            cim22-native-v1-${{ matrix.runner }}-${{ env.LLVM_COMMIT }}-${{
            hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'lib/**',
                      'runtime/**', 'schema/**', 'tools/**', 'python/pyproject.toml',
                      '.github/workflows/wheels.yml', '.github/scripts/repack-native-wheel.py') }}-${{
            matrix.platform == 'linux'
            && hashFiles('.github/manylinux/**', '.github/scripts/build-llvm-sdk.sh',
                         '.github/scripts/build-manylinux.sh', 'third_party/cyusb-linux/**')
            || hashFiles('.github/scripts/build-llvm-sdk.ps1',
                         '.github/scripts/build-windows-wheel.ps1', 'third_party/cyapi/**') }}

      - name: Record native cache selection
        shell: bash
        env:
          CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.native-cache.outputs.cache-primary-key }}
        run: |
          set -euo pipefail
          printf 'hit=%s\nkey=%s\n' "$CACHE_HIT" "$CACHE_KEY" > native-plan.txt

      - uses: actions/upload-artifact@v7
        with:
          name: native-plan-${{ matrix.platform }}
          path: native-plan.txt
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: steps.native-cache.outputs.cache-hit == 'true'
        with:
          name: native-wheel-${{ matrix.platform }}
          path: native-wheel-payload/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Cache Linux SDK
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'linux'
        id: sdk-cache-linux
        uses: actions/cache@v6
        with:
          path: .cache/manylinux/sdk-package
          key: llvm-sdk-x86_64-${{ env.LLVM_COMMIT }}-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}

      - name: Cache Windows SDK
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'windows'
        id: sdk-cache-windows
        uses: actions/cache@v6
        with:
          path: .cache/windows/llvm-sdk
          key: llvm-sdk-windows-2022-x64-${{ env.LLVM_COMMIT }}-${{ hashFiles('.github/scripts/build-llvm-sdk.ps1') }}

      - name: Checkout pinned LLVM source for Linux
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'linux' && steps.sdk-cache-linux.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_COMMIT }}
          path: .cache/manylinux/llvm-source
          persist-credentials: false

      - name: Checkout pinned LLVM source for Windows
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'windows' && steps.sdk-cache-windows.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_COMMIT }}
          path: .cache/windows/llvm-source
          persist-credentials: false

      - name: Restore Linux ccache
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'linux' && steps.sdk-cache-linux.outputs.cache-hit != 'true'
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .cache/manylinux/ccache
          key: llvm-ccache-x86_64-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}-${{ env.LLVM_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llvm-ccache-x86_64-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}-${{ env.LLVM_COMMIT }}-
            llvm-ccache-x86_64-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}-

      - name: Prepare Windows build environment
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build static Linux LLVM/MLIR SDK in manylinux
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'linux' && steps.sdk-cache-linux.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          mkdir -p .cache/manylinux/{sdk-package,ccache,work}
          df -h .
          docker build -f .github/manylinux/Containerfile -t cim22-manylinux .github/manylinux
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/io:ro" \
            -v "$PWD/.cache/manylinux/llvm-source:/llvm-source:ro" \
            -v "$PWD/.cache/manylinux/ccache:/ccache" \
            -v "$PWD/.cache/manylinux/work:/work" \
            -v "$PWD/.cache/manylinux/sdk-package:/out" \
            -e HOME=/work/home -e LLVM_VERSION -e LLVM_COMMIT \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            cim22-manylinux bash /io/.github/scripts/build-llvm-sdk.sh
          df -h .

      - name: Build static Windows LLVM/MLIR SDK
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'windows' && steps.sdk-cache-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: .github/scripts/build-llvm-sdk.ps1 -SourceDir .cache/windows/llvm-source -SdkDir .cache/windows/llvm-sdk

      - name: Save Linux ccache
        if: ${{ always() && steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'linux' && steps.sdk-cache-linux.outputs.cache-hit != 'true' && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/manylinux/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Verify Linux SDK archive
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'linux'
        shell: bash
        working-directory: .cache/manylinux/sdk-package
        run: sha256sum --check LLVM-*.sha256

      - name: Verify Windows SDK
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (!(Test-Path .cache/windows/llvm-sdk/SDK-INFO.txt)) {
              throw 'Windows SDK is missing SDK-INFO.txt'
          }
          $llvmConfig = (Resolve-Path .cache/windows/llvm-sdk/bin/llvm-config.exe).Path
          if ((& $llvmConfig --version) -ne $env:LLVM_VERSION -or
              (& $llvmConfig --shared-mode) -ne 'static' -or
              (& $llvmConfig --build-mode) -ne 'Release' -or
              (& $llvmConfig --assertion-mode) -ne 'OFF') {
              throw 'Expected the pinned static Windows LLVM/MLIR SDK'
          }

      - name: Package Windows SDK
        if: steps.native-cache.outputs.cache-hit != 'true' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $packageDir = New-Item -ItemType Directory -Force .cache/windows/sdk-package
          $archive = "LLVM-$env:LLVM_VERSION-x86_64-pc-windows-msvc.zip"
          # Windows bsdtar supports ZIP64, unlike Compress-Archive's 2 GB limit.
          tar -a -cf "$packageDir/$archive" -C .cache/windows/llvm-sdk .
          $hash = (Get-FileHash "$packageDir/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "$packageDir/$archive.sha256"

      - uses: actions/upload-artifact@v7
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ matrix.sdk-package }}/LLVM-${{ env.LLVM_VERSION }}-${{ matrix.sdk-suffix }}
          archive: false
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ matrix.sdk-package }}/LLVM-${{ env.LLVM_VERSION }}-${{ matrix.sdk-suffix }}.sha256
          archive: false
          if-no-files-found: error
          retention-days: 7

  build-wheel:
    needs: [sdk, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            sdk-package: .cache/manylinux/sdk-package
            sdk-suffix: Linux-X64.tar.zst
            dist-dir: manylinux
          - platform: windows
            runner: windows-2022
            sdk-package: .cache/windows/sdk-package
            sdk-suffix: x86_64-pc-windows-msvc.zip
            dist-dir: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      SCCACHE_DIR: ${{ github.workspace }}/.cache/project-compiler
      SCCACHE_CACHE_SIZE: '1G'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: wheel-web-static
          path: python/cim22/web/static

      - uses: actions/download-artifact@v8
        with:
          name: native-plan-${{ matrix.platform }}

      - name: Read native cache selection
        id: native-plan
        shell: bash
        run: cat native-plan.txt >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.native-plan.outputs.hit == 'true'
        with:
          name: native-wheel-${{ matrix.platform }}
          path: native-wheel-payload

      - uses: actions/download-artifact@v8
        if: steps.native-plan.outputs.hit != 'true'
        with:
          pattern: LLVM-${{ env.LLVM_VERSION }}-${{ matrix.sdk-suffix }}*
          path: ${{ matrix.sdk-package }}
          merge-multiple: true
          skip-decompress: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare Windows build environment
        if: matrix.platform == 'windows' && steps.native-plan.outputs.hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install wheel packaging tools
        run: python -m pip install wheel

      - name: Install uv for wheel assembly
        if: matrix.platform == 'windows' || steps.native-plan.outputs.hit == 'true'
        run: python -m pip install uv==0.13.1

      - name: Install Windows native build tools
        if: matrix.platform == 'windows' && steps.native-plan.outputs.hit != 'true'
        run: python -m pip install ninja==1.13.2

      - name: Cache CIM22 native compiler objects
        if: steps.native-plan.outputs.hit != 'true'
        uses: actions/cache@v6
        with:
          path: .cache/project-compiler
          key: cim22-objects-v1-${{ steps.native-plan.outputs.key }}
          restore-keys: |
            cim22-objects-v1-cim22-native-v1-${{ matrix.runner }}-${{ env.LLVM_COMMIT }}-

      - name: Install Windows compiler cache
        if: matrix.platform == 'windows' && steps.native-plan.outputs.hit != 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0

      - name: Check packaging helpers and set wheel version
        run: |
          python .github/scripts/test_repack_native_wheel.py
          python .github/scripts/test_prepare_wheel.py
          python .github/scripts/prepare-wheel.py

      - name: Extract shared Linux SDK
        if: matrix.platform == 'linux' && steps.native-plan.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd .cache/manylinux/sdk-package
          archive="LLVM-${LLVM_VERSION}-Linux-X64.tar.zst"
          sha256sum --check "$archive.sha256"
          mkdir ../llvm-sdk
          tar --use-compress-program='zstd -d' -xf "$archive" -C ../llvm-sdk
          echo "LLVM_SDK_SHA256=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          rm -- "$archive"

      - name: Extract shared Windows SDK
        if: matrix.platform == 'windows' && steps.native-plan.outputs.hit != 'true'
        shell: pwsh
        working-directory: .cache/windows/sdk-package
        run: |
          $archive = "LLVM-$env:LLVM_VERSION-x86_64-pc-windows-msvc.zip"
          $checksum = (Get-Content -Raw "$archive.sha256").Trim() -split '  ', 2
          if ($checksum.Count -ne 2 -or $checksum[1] -ne $archive -or
              (Get-FileHash $archive -Algorithm SHA256).Hash -ne $checksum[0]) {
              throw 'Windows SDK checksum mismatch'
          }
          New-Item -ItemType Directory -Force ../llvm-sdk | Out-Null
          tar -xf $archive -C ../llvm-sdk
          Remove-Item $archive

      - name: Verify Linux CyUSB bundle
        if: matrix.platform == 'linux' && steps.native-plan.outputs.hit != 'true'
        shell: bash
        working-directory: third_party/cyusb-linux
        run: sha256sum --check SHA256SUMS

      - name: Build Linux wheel in manylinux
        if: matrix.platform == 'linux' && steps.native-plan.outputs.hit != 'true'
        shell: bash
        env:
          PROJECT_COMMIT: ${{ github.sha }}
          BUILD_RUNNER: ubuntu-24.04
        run: |
          set -euo pipefail
          mkdir -p .cache/manylinux/work .cache/project-compiler python/dist/manylinux
          docker build -f .github/manylinux/Containerfile -t cim22-manylinux .github/manylinux
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/io" \
            -v "$PWD/.cache/manylinux/llvm-sdk:/opt/llvm:ro" \
            -v "$PWD/.cache/manylinux/work:/work" \
            -v "$PWD/.cache/project-compiler:/work/ccache" \
            -v "$PWD/python/dist/manylinux:/out" \
            -e HOME=/work/home -e PROJECT_COMMIT -e BUILD_RUNNER \
            -e LLVM_VERSION -e LLVM_COMMIT -e LLVM_SDK_SHA256 \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            cim22-manylinux bash /io/.github/scripts/build-manylinux.sh

      - name: Build Windows wheel with USB support
        if: matrix.platform == 'windows' && steps.native-plan.outputs.hit != 'true'
        shell: pwsh
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
        run: .github/scripts/build-windows-wheel.ps1 -SdkDir .cache/windows/llvm-sdk -CyapiRoot third_party/cyapi -DistDir python/dist/windows

      - name: Assemble wheel from cached native payload
        if: steps.native-plan.outputs.hit == 'true'
        run: python .github/scripts/repack-native-wheel.py build native-wheel-payload python/dist/${{ matrix.dist-dir }}

      - name: Check Linux wheel contents
        if: matrix.platform == 'linux'
        shell: bash
        run: python .github/scripts/check-wheel-contents.py python/dist/manylinux/*.whl

      - name: Check Windows wheel contents
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python .github/scripts/check-wheel-contents.py (Get-ChildItem python/dist/windows/*.whl).FullName

      - name: Extract native payload for reuse
        if: steps.native-plan.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          wheels=(python/dist/${{ matrix.dist-dir }}/*.whl)
          test "${#wheels[@]}" -eq 1
          python .github/scripts/repack-native-wheel.py save "${wheels[0]}" native-wheel-payload

      - name: Save native wheel payload
        if: steps.native-plan.outputs.hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: native-wheel-payload
          key: ${{ steps.native-plan.outputs.key }}

      - uses: actions/upload-artifact@v7
        with:
          path: python/dist/${{ matrix.dist-dir }}/*.whl
          archive: false
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: python/dist/${{ matrix.dist-dir }}/*.whl.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

  validate-wheel:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            dist-dir: manylinux
            wheel-tag: manylinux_2_28_x86_64
          - platform: linux
            runner: ubuntu-24.04
            dist-dir: manylinux
            wheel-tag: manylinux_2_28_x86_64
          - platform: linux
            runner: ubuntu-26.04
            dist-dir: manylinux
            wheel-tag: manylinux_2_28_x86_64
          - platform: windows
            runner: windows-2022
            dist-dir: windows
            wheel-tag: win_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: mlir_cim22-*-py3-none-*${{ matrix.wheel-tag }}*.whl*
          path: python/dist/${{ matrix.dist-dir }}
          merge-multiple: true
          skip-decompress: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepare Windows validation environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate Linux checksum
        if: matrix.platform == 'linux'
        shell: bash
        working-directory: python/dist/manylinux
        run: sha256sum --check *.whl.sha256

      - name: Validate Windows checksum
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: python/dist/windows
        run: |
          $wheel = @(Get-ChildItem '*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one Windows wheel' }
          $checksum = (Get-Content -Raw "$($wheel[0].Name).sha256").Trim() -split '  ', 2
          if ($checksum.Count -ne 2 -or $checksum[1] -ne $wheel[0].Name -or
              (Get-FileHash $wheel[0].FullName -Algorithm SHA256).Hash -ne $checksum[0]) {
              throw 'Windows wheel checksum mismatch'
          }

      - name: Validate installed Linux wheel outside checkout
        if: matrix.platform == 'linux'
        shell: bash
        run: bash .github/scripts/test-wheel.sh python/dist/manylinux

      - name: Validate installed Windows wheel outside checkout
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .github/scripts/test-windows-wheel.ps1 -DistDir python/dist/windows
