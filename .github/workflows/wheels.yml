name: Build Linux and Windows wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  LLVM_VERSION: '22.1.8'
  LLVM_COMMIT: ca7933e47d3a3451d81e72ac174dcb5aa28b59d1

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache@v6
        id: sdk
        with:
          path: .cache/manylinux/sdk-package
          key: llvm-sdk-x86_64-${{ env.LLVM_COMMIT }}-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}

      - uses: actions/checkout@v7
        if: steps.sdk.outputs.cache-hit != 'true'
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_COMMIT }}
          path: .cache/manylinux/llvm-source
          persist-credentials: false

      - uses: actions/cache/restore@v6
        if: steps.sdk.outputs.cache-hit != 'true'
        id: ccache
        with:
          path: .cache/manylinux/ccache
          key: llvm-ccache-x86_64-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}-${{ env.LLVM_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            llvm-ccache-x86_64-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}-${{ env.LLVM_COMMIT }}-
            llvm-ccache-x86_64-${{ hashFiles('.github/manylinux/Containerfile', '.github/scripts/build-llvm-sdk.sh') }}-

      - name: Build static LLVM/MLIR SDK in manylinux
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          # Reclaim unused hosted-runner SDKs before the first LLVM build.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          mkdir -p .cache/manylinux/{sdk-package,ccache,work}
          df -h .
          docker build -f .github/manylinux/Containerfile -t cim22-manylinux .github/manylinux
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/io:ro" \
            -v "$PWD/.cache/manylinux/llvm-source:/llvm-source:ro" \
            -v "$PWD/.cache/manylinux/ccache:/ccache" \
            -v "$PWD/.cache/manylinux/work:/work" \
            -v "$PWD/.cache/manylinux/sdk-package:/out" \
            -e HOME=/work/home -e LLVM_VERSION -e LLVM_COMMIT \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            cim22-manylinux bash /io/.github/scripts/build-llvm-sdk.sh
          df -h .

      - uses: actions/cache/save@v6
        if: ${{ always() && steps.sdk.outputs.cache-hit != 'true' && steps.ccache.outcome == 'success' }}
        with:
          path: .cache/manylinux/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Verify SDK archive
        working-directory: .cache/manylinux/sdk-package
        run: sha256sum --check SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: llvm-sdk
          path: .cache/manylinux/sdk-package/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-wheel:
    needs: sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: llvm-sdk
          path: .cache/manylinux/sdk-package

      - name: Extract shared SDK
        run: |
          cd .cache/manylinux/sdk-package
          sha256sum --check SHA256SUMS
          mkdir ../llvm-sdk
          tar --use-compress-program='zstd -d' -xf llvm-sdk.tar.zst -C ../llvm-sdk
          echo "LLVM_SDK_SHA256=$(sha256sum llvm-sdk.tar.zst | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          rm -- llvm-sdk.tar.zst

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set release or development wheel version
        run: |
          python3 .github/scripts/test_prepare_wheel.py
          python3 .github/scripts/prepare-wheel.py

      - name: Build native wheel in manylinux
        env:
          PROJECT_COMMIT: ${{ github.sha }}
          BUILD_RUNNER: ubuntu-24.04
        run: |
          mkdir -p .cache/manylinux/work python/dist/manylinux
          docker build -f .github/manylinux/Containerfile -t cim22-manylinux .github/manylinux
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/io:ro" \
            -v "$PWD/.cache/manylinux/llvm-sdk:/opt/llvm:ro" \
            -v "$PWD/.cache/manylinux/work:/work" \
            -v "$PWD/python/dist/manylinux:/out" \
            -e HOME=/work/home -e PROJECT_COMMIT -e BUILD_RUNNER \
            -e LLVM_VERSION -e LLVM_COMMIT -e LLVM_SDK_SHA256 \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            cim22-manylinux bash /io/.github/scripts/build-manylinux.sh

      - uses: actions/upload-artifact@v7
        with:
          path: python/dist/manylinux/*.whl
          archive: false
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: python/dist/manylinux/SHA256SUMS-linux
          archive: false
          if-no-files-found: error
          retention-days: 14

  validate-wheel:
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: mlir_cim22-*-manylinux*.whl
          merge-multiple: true
          path: python/dist/manylinux

      - uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS-linux
          path: python/dist/manylinux

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate checksum
        working-directory: python/dist/manylinux
        run: sha256sum --check SHA256SUMS-linux

      - name: Validate installed wheel outside checkout
        run: bash .github/scripts/test-wheel.sh python/dist/manylinux

  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        run: python -m pip install uv==0.13.1 ninja==1.13.2 wheel

      - uses: actions/cache@v6
        id: windows-sdk
        with:
          path: .cache/windows/llvm-sdk
          key: llvm-sdk-windows-2022-x64-${{ env.LLVM_COMMIT }}-${{ hashFiles('.github/scripts/build-llvm-sdk.ps1') }}

      - uses: actions/checkout@v7
        if: steps.windows-sdk.outputs.cache-hit != 'true'
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_COMMIT }}
          path: .cache/windows/llvm-source
          persist-credentials: false

      - name: Build static Windows LLVM/MLIR SDK
        if: steps.windows-sdk.outputs.cache-hit != 'true'
        run: .github/scripts/build-llvm-sdk.ps1 -SourceDir .cache/windows/llvm-source -SdkDir .cache/windows/llvm-sdk

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Build frontend
        working-directory: web
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set release or development wheel version
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .github/scripts/test-windows-build-arguments.ps1
          python .github/scripts/test_prepare_wheel.py
          python .github/scripts/prepare-wheel.py

      - name: Build Windows wheel with USB support
        run: .github/scripts/build-windows-wheel.ps1 -SdkDir .cache/windows/llvm-sdk -CyapiRoot third_party/cyapi -DistDir python/dist/windows

      - name: Validate installed Windows wheel outside checkout
        run: .github/scripts/test-windows-wheel.ps1 -DistDir python/dist/windows

      - uses: actions/upload-artifact@v7
        with:
          path: python/dist/windows/*.whl
          archive: false
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: python/dist/windows/SHA256SUMS-windows
          archive: false
          if-no-files-found: error
          retention-days: 14
